[project]
name = "lora-character-overlap-finder"
version = "1.1.2"
description = "Windows GUI for detecting duplicate and overlapping character LoRAs."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7",
  "requests>=2.32",
  "send2trash>=1.8.3",
]

[project.scripts]
lora-overlap-finder = "lora_overlap_finder.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
