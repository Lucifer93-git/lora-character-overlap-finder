name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/build-windows.yml"
  release:
    types: [published]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name "LoRA-Character-Overlap-Finder" --paths "$PWD/src" --collect-submodules lora_overlap_finder launcher.py

      - name: Verify packaged imports
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --console --name "LoRA-Character-Overlap-Finder-SmokeTest" --paths "$PWD/src" --collect-submodules lora_overlap_finder smoke_test.py
          & ".\\dist\\LoRA-Character-Overlap-Finder-SmokeTest.exe"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lora-character-overlap-finder-windows
          path: dist/LoRA-Character-Overlap-Finder.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LoRA-Character-Overlap-Finder.exe
